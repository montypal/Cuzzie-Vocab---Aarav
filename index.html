<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuzzie Vocab Challenge</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header>
            <h1>Cuzzie Vocab Challenge</h1>
            <p class="subtitle">May the most sagacious cousin win!</p>
        </header>

        <section id="wheel-section">
            <div class="wheel-container">
                <div id="wheel"></div>
                <div id="pointer"></div>
            </div>
            <button id="spin-btn">Spin to Start!</button>
            <p id="turn-display">Spin the wheel to see who goes first!</p>
        </section>

        <section id="quiz-section" class="hidden">
            <div id="question-card">
                <h2 id="vocab-word">Word</h2>
                <div id="options-container">
                    </div>
            </div>
            <div id="feedback" class="hidden"></div>
            <p id="score-display">Score: 0</p>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
