<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuzzie Vocab Challenge 2.0</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <aside class="leaderboard">
            <h2>Cuzzie Leaderboard</h2>
            <div id="score-list"></div>
        </aside>

        <main class="game-area">
            <header>
                <h1>Cuzzie Vocab Slay</h1>
                <p id="status-text">Pointer is at the TOP. Spin to play!</p>
            </header>

            <div class="wheel-box">
                <div id="wheel-pointer"></div>
                <canvas id="wheelCanvas" width="450" height="450"></canvas>
                <button id="spin-button">SPIN WHEEL</button>
            </div>

            <div id="quiz-overlay" class="hidden">
                <div class="quiz-card">
                    <h2 id="player-tag">Player's Turn</h2>
                    <div class="word-display" id="vocab-word">WORD</div>
                    <div id="options-grid"></div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
